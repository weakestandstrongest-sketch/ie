<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>帰る</title>
  <meta name="description" content="現在地から家までの経路だけを出す">
  <meta name="theme-color" content="#f6f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0f11" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="帰る">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <header class="top">
    <p class="date" id="date"></p>
    <h1 class="greet" id="greet">おつかれさま</h1>
  </header>

  <main>
    <section class="result" id="result" hidden aria-live="polite">
      <div class="summary">
        <p class="eyebrow">家に着くのは</p>
        <p class="arrive"><span id="arrTime">--:--</span></p>
        <p class="leave"><span id="depTime"></span><span class="badge" id="countdown"></span></p>
        <ul class="facts" id="facts"></ul>
      </div>

      <ol class="timeline" id="timeline"></ol>

      <div class="others" id="othersWrap" hidden>
        <p class="section-label">ほかの電車</p>
        <ul class="others-list" id="others"></ul>
      </div>

      <p class="foot"><a id="yahooLink" target="_blank" rel="noopener">Yahoo!乗換案内で見る</a></p>
    </section>

    <section class="message" id="message" hidden>
      <p class="message-title" id="messageTitle"></p>
      <p class="message-body" id="messageBody"></p>
    </section>
  </main>

  <p class="home-label" id="homeLabel" role="link" tabindex="0"></p>

  <button class="go" id="go" type="button" aria-label="帰る">
    <span class="go-ring" aria-hidden="true"></span>
    <span class="go-inner">
      <svg class="go-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.6 12 3.8l8.5 6.8V19a1.6 1.6 0 0 1-1.6 1.6h-4.1v-5.4H9.2v5.4H5.1A1.6 1.6 0 0 1 3.5 19z"/></svg>
      <span class="go-text" id="goText">帰る</span>
    </span>
    <span class="go-spin" aria-hidden="true"></span>
  </button>

  <dialog class="sheet" id="homeSheet">
    <form method="dialog" id="homeForm" autocomplete="off">
      <div class="sheet-grip" aria-hidden="true"></div>
      <h2>家はどこですか？</h2>
      <p class="sheet-sub">最寄り駅か住所を入れてください。<br>この端末にだけ保存されます。</p>
      <div class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.6 12 3.8l8.5 6.8V19a1.6 1.6 0 0 1-1.6 1.6h-4.1v-5.4H9.2v5.4H5.1A1.6 1.6 0 0 1 3.5 19z"/></svg>
        <input id="homeInput" type="text" enterkeyhint="done" placeholder="例：岐阜駅、岐阜市司町40" maxlength="60">
      </div>
      <ul class="suggest" id="suggest"></ul>
      <p class="sheet-link" id="useHere" role="link" tabindex="0">今いる場所を家にする</p>
      <p class="sheet-note" id="sheetNote"></p>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
