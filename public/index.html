<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>帰る</title>
  <meta name="description" content="現在地から家までの経路だけを出す">
  <meta name="theme-color" content="#f6f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0f11" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="帰る">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.add('intro');</script>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <header class="top">
    <div class="top-text">
      <p class="date" id="date"></p>
      <h1 class="greet" id="greet">おつかれさま</h1>
    </div>
    <button class="settings" id="settings" type="button" aria-label="家の場所を設定">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.7 2.5a1 1 0 0 1 1 .8l.3 1.9a7.6 7.6 0 0 1 1.6.9l1.8-.7a1 1 0 0 1 1.2.4l1.7 3a1 1 0 0 1-.2 1.2l-1.5 1.2a7.7 7.7 0 0 1 0 1.8l1.5 1.2a1 1 0 0 1 .2 1.2l-1.7 3a1 1 0 0 1-1.2.4l-1.8-.7a7.6 7.6 0 0 1-1.6.9l-.3 1.9a1 1 0 0 1-1 .8h-3.4a1 1 0 0 1-1-.8l-.3-1.9a7.6 7.6 0 0 1-1.6-.9l-1.8.7a1 1 0 0 1-1.2-.4l-1.7-3a1 1 0 0 1 .2-1.2l1.5-1.2a7.7 7.7 0 0 1 0-1.8L2.9 9.9a1 1 0 0 1-.2-1.2l1.7-3a1 1 0 0 1 1.2-.4l1.8.7a7.6 7.6 0 0 1 1.6-.9l.3-1.9a1 1 0 0 1 1-.8zM12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8z"/></svg>
    </button>
  </header>

  <main>
    <section class="result" id="result" hidden aria-live="polite">
      <div class="summary">
        <p class="eyebrow">家に着くのは<span class="day" id="arrDay"></span></p>
        <p class="arrive"><span id="arrTime">--:--</span></p>
        <p class="leave"><span id="depTime"></span><span class="badge" id="countdown"></span></p>
        <ul class="facts" id="facts"></ul>
      </div>

      <ol class="timeline" id="timeline"></ol>

      <div class="others" id="othersWrap" hidden>
        <p class="section-label">ほかの電車</p>
        <ul class="others-list" id="others"></ul>
      </div>

      <p class="foot"><a id="yahooLink" target="_blank" rel="noopener">Yahoo!乗換案内で見る</a></p>
      <p class="saved" id="saved"></p>
    </section>

    <section class="message" id="message" hidden>
      <p class="message-title" id="messageTitle"></p>
      <p class="message-body" id="messageBody"></p>
    </section>
  </main>

  <p class="home-label" id="homeLabel" role="link" tabindex="0"></p>

  <div class="veil" aria-hidden="true"></div>

  <button class="go" id="go" type="button" aria-label="帰る">
    <span class="go-ring" aria-hidden="true"></span>
    <svg class="go-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.6 12 3.8l8.5 6.8V19a1.6 1.6 0 0 1-1.6 1.6h-4.1v-5.4H9.2v5.4H5.1A1.6 1.6 0 0 1 3.5 19z"/></svg>
    <svg class="go-spinner" viewBox="0 0 24 24" aria-hidden="true"><circle class="track" cx="12" cy="12" r="9"/><circle class="arc" cx="12" cy="12" r="9"/></svg>
    <span class="go-text" id="goText">帰る</span>
  </button>

  <dialog class="sheet" id="homeSheet">
    <form method="dialog" id="homeForm" autocomplete="off">
      <div class="sheet-grip" aria-hidden="true"></div>
      <h2>家はどこですか？</h2>
      <p class="sheet-sub">最寄り駅か住所を入れてください。<br>この端末にだけ保存されます。</p>
      <div class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.6 12 3.8l8.5 6.8V19a1.6 1.6 0 0 1-1.6 1.6h-4.1v-5.4H9.2v5.4H5.1A1.6 1.6 0 0 1 3.5 19z"/></svg>
        <input id="homeInput" type="text" enterkeyhint="done" placeholder="例：岐阜駅、岐阜市司町40" maxlength="60">
      </div>
      <ul class="suggest" id="suggest"></ul>
      <p class="sheet-link" id="useHere" role="link" tabindex="0">今いる場所を家にする</p>
      <p class="sheet-note" id="sheetNote"></p>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
